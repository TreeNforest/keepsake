<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拾綴 Keepsake</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3F5544">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
:root{
  --paper:#ECEFE8; --sheet:#F7F8F4; --ink:#22302A; --moss:#3F5544;
  --mute:#7A8679; --line:#D3D9CF; --thread:#B4555A;
  --hand:"LXGW WenKai TC","Iansui",serif;
  --sans:system-ui,"Noto Sans TC","PingFang TC",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#1C221E; --sheet:#262D28; --ink:#E4E8E0; --moss:#9DB39F;
  --mute:#8B968A; --line:#3A443C; --thread:#D07A7E;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--thread);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 100px)}
header{display:flex;align-items:baseline;gap:10px;margin:6px 2px 12px}
header h1{font-family:var(--hand);font-size:30px;font-weight:700;margin:0;color:var(--moss);letter-spacing:.06em}
header span{color:var(--mute);font-size:13px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;padding:7px 14px;border-radius:999px;font-size:14px}
.chip.on{background:var(--moss);color:var(--paper);border-color:var(--moss)}
.chip.add{border-style:dashed;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

.folderbar{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 8px;font-family:var(--hand);font-size:19px}
.folderbar button{background:none;border:0;color:var(--mute);font-size:20px;padding:4px}

.search{display:flex;align-items:center;gap:8px;background:var(--sheet);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.search i{color:var(--mute)}
.search input{flex:1;border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);outline:none;min-width:0}

.filters{display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-right:auto}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;color:var(--mute)}
.seg button.on{background:var(--ink);color:var(--paper)}
.pbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--mute);font-size:18px;display:grid;place-items:center}
.pbtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.item{display:flex;gap:10px;align-items:flex-start;background:var(--sheet);margin-bottom:10px;padding:13px 6px 13px 10px;border-left:3px dashed var(--c);border-radius:3px 14px 14px 3px}
.item .check{background:none;border:0;font-size:22px;color:var(--mute);padding:0;margin-top:1px}
.item .body{flex:1;min-width:0;display:block}
.note{font-family:var(--hand);font-size:17px;line-height:1.55;word-break:break-word;margin-bottom:3px}
.url{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--mute);min-width:0}
.url span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.url.solo{font-size:15px;color:var(--ink)}
.url i{font-size:15px;flex:none}
.meta{display:flex;gap:10px;font-size:12px;color:var(--mute);margin-top:5px}
.item .more{background:none;border:0;color:var(--mute);font-size:20px;padding:2px 4px}
.item.read .note,.item.read .url{opacity:.5}

.empty{text-align:center;color:var(--mute);padding:56px 24px;line-height:1.8}
.empty i{font-size:40px;color:var(--line);display:block;margin-bottom:8px}
.localnote{text-align:center;font-size:12px;color:var(--mute);margin-top:24px}

.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:58px;height:58px;border-radius:18px;border:0;background:var(--thread);color:#fff;font-size:28px;display:grid;place-items:center;box-shadow:0 8px 20px rgba(80,40,40,.28)}

.scrim{position:fixed;inset:0;z-index:20;background:rgba(18,24,20,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:100%;max-width:640px;max-height:90vh;overflow:auto;background:var(--sheet);border-radius:22px 22px 0 0;padding:8px 18px calc(env(safe-area-inset-bottom,0px) + 20px);animation:up .24s cubic-bezier(.2,.8,.2,1)}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-family:var(--hand);font-size:21px;margin:4px 0 12px}
.preview{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:12px;background:var(--paper);font-size:14px;margin-bottom:10px;min-width:0}
.preview span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview i{font-size:18px;color:var(--mute);flex:none}
.hint{font-size:13px;color:var(--thread);margin:-2px 2px 10px}
.lbl{display:block;font-size:13px;color:var(--mute);margin:12px 2px 6px}
.row{display:flex;gap:8px}
input.txt,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);padding:11px 12px;font:inherit;font-size:15px;outline:none;resize:none}
textarea{font-family:var(--hand);font-size:16px;line-height:1.5}
input.txt:focus,textarea:focus{border-color:var(--moss)}

.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fgrid.off{opacity:.4;pointer-events:none}
.fbtn{display:flex;align-items:center;gap:10px;min-height:58px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--paper);text-align:left;font-family:var(--hand);font-size:17px}
.fbtn .bar{width:4px;align-self:stretch;border-radius:2px;background:var(--c)}
.fbtn b{flex:1;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbtn small{font-family:var(--sans);font-size:12px;color:var(--mute)}
.fbtn.new{border-style:dashed;color:var(--mute);justify-content:center}
.fbtn:active{transform:scale(.97)}

.ghost{background:none;border:0;color:var(--mute);font-size:14px;padding:8px 6px}
.linkbtn{display:block;margin:12px auto 0}
.primary{border:0;background:var(--moss);color:var(--paper);border-radius:12px;padding:11px 20px;font-size:15px}
.danger{border:1px solid var(--line);background:none;color:var(--thread);border-radius:12px;padding:11px 16px;font-size:15px}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.toggle{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:15px}
.toggle input{width:18px;height:18px;accent-color:var(--moss)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;background:var(--c)}
.sw.on{border-color:var(--ink)}

.done{position:fixed;inset:0;z-index:30;background:var(--paper);display:grid;place-items:center;text-align:center;padding:24px;animation:fade .2s}
.done i{font-size:64px;color:var(--moss)}
.done h2{font-family:var(--hand);font-size:24px;margin:10px 0 6px}
.done p{color:var(--mute);margin:0 0 20px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;white-space:nowrap;animation:fade .15s}

@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import React, { useState, useEffect, useMemo, useRef } from 'https://esm.sh/react@18.3.1';
import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
import htm from 'https://esm.sh/htm@3.1.1';
const html = htm.bind(React.createElement);

/* ===== Firebase：貼上你的設定。留空的話，資料先存在這支手機裡 ===== */
const firebaseConfig = {
  // apiKey: "",
  // authDomain: "",
  // projectId: "",
  // storageBucket: "",
  // messagingSenderId: "",
  // appId: ""
};
const COL_ITEMS = 'shizhui_items';
const COL_FOLDERS = 'shizhui_folders';

const COLORS = ['#7D8F7A', '#B4555A', '#8C7A9B', '#C49A5A', '#5F7F95', '#9A8B7A', '#6E9C93', '#A0727F'];

const PLATFORMS = [
  { id: 'threads',   name: 'Threads',   icon: 'ph-threads-logo',   re: /(^|\.)threads\.(net|com)$/ },
  { id: 'instagram', name: 'Instagram', icon: 'ph-instagram-logo', re: /(^|\.)instagram\.com$/ },
  { id: 'facebook',  name: 'Facebook',  icon: 'ph-facebook-logo',  re: /(^|\.)(facebook\.com|fb\.com|fb\.watch)$/ },
  { id: 'youtube',   name: 'YouTube',   icon: 'ph-youtube-logo',   re: /(^|\.)(youtube\.com|youtu\.be)$/ },
  { id: 'x',         name: 'X',         icon: 'ph-x-logo',         re: /(^|\.)(x\.com|twitter\.com)$/ },
  { id: 'tiktok',    name: 'TikTok',    icon: 'ph-tiktok-logo',    re: /(^|\.)tiktok\.com$/ },
];
const WEB = { id: 'web', name: '網頁', icon: 'ph-globe' };
const P_BY_ID = Object.fromEntries([...PLATFORMS, WEB].map(p => [p.id, p]));

function platformOf(url) {
  try { const h = new URL(url).hostname.toLowerCase(); return PLATFORMS.find(p => p.re.test(h)) || WEB; }
  catch { return WEB; }
}
function cleanUrl(u) {
  try {
    const x = new URL(u);
    [...x.searchParams.keys()].forEach(k => {
      if (/^(utm_.*|igsh|igshid|fbclid|xmt|slof|mibextid|si)$/.test(k)) x.searchParams.delete(k);
    });
    return x.toString();
  } catch { return u; }
}
function extractUrl(s) {
  const m = (s || '').match(/https?:\/\/[^\s"'<>，。]+/);
  return m ? cleanUrl(m[0]) : '';
}
function shortUrl(u) {
  try { const x = new URL(u); return x.hostname.replace(/^www\./, '') + x.pathname.replace(/\/$/, ''); }
  catch { return u; }
}
function relDate(ms) {
  if (!ms) return '';
  const d = new Date(ms), now = new Date();
  const day = 864e5, start = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  if (ms >= start) return '今天';
  if (ms >= start - day) return '昨天';
  return d.getFullYear() === now.getFullYear() ? `${d.getMonth() + 1}/${d.getDate()}` : `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
}

/* ===== 資料層：Firestore 或本機 ===== */
async function createStore() {
  if (firebaseConfig.projectId) {
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const fs = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    const db = fs.initializeFirestore(initializeApp(firebaseConfig), {
      localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() })
    });
    const items = fs.collection(db, COL_ITEMS), folders = fs.collection(db, COL_FOLDERS);
    return {
      kind: 'cloud',
      subscribe(cb) {
        let s = { items: [], folders: [] };
        const u1 = fs.onSnapshot(items, q => { s = { ...s, items: q.docs.map(d => ({ id: d.id, ...d.data() })) }; cb(s); });
        const u2 = fs.onSnapshot(folders, q => { s = { ...s, folders: q.docs.map(d => ({ id: d.id, ...d.data() })) }; cb(s); });
        return () => { u1(); u2(); };
      },
      addItem: d => fs.addDoc(items, d),
      updateItem: (id, p) => fs.updateDoc(fs.doc(items, id), p),
      deleteItem: id => fs.deleteDoc(fs.doc(items, id)),
      addFolder: d => fs.addDoc(folders, d).then(r => r.id),
      updateFolder: (id, p) => fs.updateDoc(fs.doc(folders, id), p),
      deleteFolder: id => fs.deleteDoc(fs.doc(folders, id)),
    };
  }
  const KEY = 'shizhui-data';
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch {}
  s = s || { items: [], folders: [] };
  const subs = new Set();
  const commit = () => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} subs.forEach(f => f(s)); };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  return {
    kind: 'local',
    subscribe(cb) { subs.add(cb); cb(s); return () => subs.delete(cb); },
    async addItem(d) { s = { ...s, items: [...s.items, { id: uid(), ...d }] }; commit(); },
    async updateItem(id, p) { s = { ...s, items: s.items.map(i => i.id === id ? { ...i, ...p } : i) }; commit(); },
    async deleteItem(id) { s = { ...s, items: s.items.filter(i => i.id !== id) }; commit(); },
    async addFolder(d) { const id = uid(); s = { ...s, folders: [...s.folders, { id, ...d }] }; commit(); return id; },
    async updateFolder(id, p) { s = { ...s, folders: s.folders.map(f => f.id === id ? { ...f, ...p } : f) }; commit(); },
    async deleteFolder(id) { s = { ...s, folders: s.folders.filter(f => f.id !== id) }; commit(); },
  };
}

/* ===== 元件 ===== */
function Sheet({ onClose, children }) {
  return html`<div className="scrim" onClick=${onClose}>
    <div className="sheet" onClick=${e => e.stopPropagation()}>
      <div className="grip"></div>
      ${children}
    </div>
  </div>`;
}

function SaveSheet({ init, shared, folders, counts, items, onSave, onNewFolder, onClose }) {
  const [url, setUrl] = useState(init || '');
  const [note, setNote] = useState('');
  const [adding, setAdding] = useState(false);
  const [fname, setFname] = useState('');
  const [busy, setBusy] = useState(false);
  const clean = extractUrl(url);
  const p = platformOf(clean);
  const dup = clean ? items.find(i => i.url === clean) : null;
  const dupFolder = dup ? (folders.find(f => f.id === dup.folderId)?.name || '未分類') : '';

  useEffect(() => { if (dup && !note) setNote(dup.note || ''); }, [dup?.id]);

  async function pick(id, name) {
    if (!clean || busy) return;
    setBusy(true);
    await onSave(clean, id, name, note.trim(), shared);
  }
  async function create() {
    const n = fname.trim();
    if (!n || !clean || busy) return;
    setBusy(true);
    const id = await onNewFolder(n);
    await onSave(clean, id, n, note.trim(), shared);
  }
  async function paste() {
    try { setUrl(await navigator.clipboard.readText()); } catch {}
  }

  return html`<${Sheet} onClose=${onClose}>
    <h2>存到哪個資料夾？</h2>
    ${!shared && html`<div className="row" style=${{ marginBottom: 10 }}>
      <input className="txt" placeholder="貼上網址" value=${url} onChange=${e => setUrl(e.target.value)} />
      <button className="ghost" onClick=${paste}>貼上</button>
    </div>`}
    ${clean && html`<div className="preview"><i className=${'ph ' + p.icon}></i><span>${shortUrl(clean)}</span></div>`}
    ${dup && html`<p className="hint">這則已經存在「${dupFolder}」，再選一次會移過去。</p>`}
    <textarea rows="2" placeholder="備註（選填）" value=${note} onChange=${e => setNote(e.target.value)}></textarea>

    <div className=${'fgrid' + (clean && !busy ? '' : ' off')}>
      ${folders.map(f => html`<button key=${f.id} className="fbtn" style=${{ '--c': f.color }} onClick=${() => pick(f.id, f.name)}>
        <span className="bar"></span><b>${f.name}</b><small>${counts[f.id] || 0}</small>
      </button>`)}
      ${adding
        ? html`<div style=${{ gridColumn: '1 / -1' }} className="row">
            <input className="txt" autoFocus placeholder="新資料夾名稱" value=${fname}
              onChange=${e => setFname(e.target.value)} onKeyDown=${e => e.key === 'Enter' && create()} />
            <button className="primary" onClick=${create}>建立並存入</button>
          </div>`
        : html`<button className="fbtn new" onClick=${() => setAdding(true)}><i className="ph ph-plus"></i> 新資料夾</button>`}
    </div>
    <button className="ghost linkbtn" disabled=${!clean || busy} onClick=${() => pick(null, '未分類')}>不分類，直接存</button>
  <//>`;
}

function EditSheet({ item, folders, onSave, onDelete, onClose }) {
  const [note, setNote] = useState(item.note || '');
  const [fid, setFid] = useState(item.folderId || null);
  const [read, setRead] = useState(!!item.read);
  const p = P_BY_ID[item.platform] || platformOf(item.url);
  const opts = [{ id: null, name: '未分類', color: 'var(--line)' }, ...folders];
  return html`<${Sheet} onClose=${onClose}>
    <h2>編輯收藏</h2>
    <a className="preview" href=${item.url} target="_blank" rel="noopener">
      <i className=${'ph ' + p.icon}></i><span>${shortUrl(item.url)}</span><i className="ph ph-arrow-square-out"></i>
    </a>
    <label className="lbl">備註</label>
    <textarea rows="3" value=${note} onChange=${e => setNote(e.target.value)}></textarea>
    <label className="lbl">資料夾</label>
    <div className="chips wrap">
      ${opts.map(f => html`<button key=${f.id || 'none'} className=${'chip' + (fid === f.id ? ' on' : '')} onClick=${() => setFid(f.id)}>
        <span className="dot" style=${{ background: f.color }}></span>${f.name}
      </button>`)}
    </div>
    <label className="toggle"><input type="checkbox" checked=${read} onChange=${e => setRead(e.target.checked)} /> 已經看過</label>
    <div className="actions">
      <button className="danger" onClick=${onDelete}>刪除</button>
      <button className="primary" onClick=${() => onSave({ note: note.trim(), folderId: fid, read })}>儲存</button>
    </div>
  <//>`;
}

function FolderSheet({ folder, onSave, onDelete, onClose }) {
  const [name, setName] = useState(folder.name);
  const [color, setColor] = useState(folder.color);
  return html`<${Sheet} onClose=${onClose}>
    <h2>編輯資料夾</h2>
    <input className="txt" value=${name} onChange=${e => setName(e.target.value)} />
    <label className="lbl">顏色</label>
    <div className="swatches">
      ${COLORS.map(c => html`<button key=${c} aria-label=${'顏色 ' + c} className=${'sw' + (c === color ? ' on' : '')} style=${{ '--c': c }} onClick=${() => setColor(c)}></button>`)}
    </div>
    <div className="actions">
      <button className="danger" onClick=${onDelete}>刪除資料夾</button>
      <button className="primary" onClick=${() => name.trim() && onSave({ name: name.trim(), color })}>儲存</button>
    </div>
  <//>`;
}

function App({ store }) {
  const [data, setData] = useState({ items: [], folders: [] });
  const [ready, setReady] = useState(false);
  const [folder, setFolder] = useState('all');      // 'all' | 'none' | folderId
  const [q, setQ] = useState('');
  const [plat, setPlat] = useState('');
  const [status, setStatus] = useState('all');      // all | unread | read
  const [sheet, setSheet] = useState(null);
  const [done, setDone] = useState(null);
  const [toast, setToast] = useState('');
  const tRef = useRef();

  useEffect(() => store.subscribe(d => { setData(d); setReady(true); }), []);

  function flash(msg) {
    setToast(msg);
    clearTimeout(tRef.current);
    tRef.current = setTimeout(() => setToast(''), 2200);
  }

  // 從分享選單進來
  useEffect(() => {
    const p = new URLSearchParams(location.search);
    if (!(p.has('url') || p.has('text') || p.has('title'))) return;
    const url = extractUrl([p.get('url'), p.get('text'), p.get('title')].join(' '));
    history.replaceState(null, '', location.pathname);
    if (url) setSheet({ type: 'save', url, shared: true });
    else flash('分享的內容裡沒有網址');
  }, []);

  const folders = useMemo(() => [...data.folders].sort((a, b) => (a.order || 0) - (b.order || 0)), [data.folders]);
  const fMap = useMemo(() => Object.fromEntries(folders.map(f => [f.id, f])), [folders]);
  const counts = useMemo(() => {
    const c = { none: 0 };
    data.items.forEach(i => { const k = fMap[i.folderId] ? i.folderId : 'none'; c[k] = (c[k] || 0) + 1; });
    return c;
  }, [data.items, fMap]);
  const usedPlatforms = useMemo(() => [...PLATFORMS, WEB].filter(p => data.items.some(i => i.platform === p.id)), [data.items]);

  const list = useMemo(() => {
    const kw = q.trim().toLowerCase();
    return data.items
      .filter(i => folder === 'all' || (folder === 'none' ? !fMap[i.folderId] : i.folderId === folder))
      .filter(i => !plat || i.platform === plat)
      .filter(i => status === 'all' || (status === 'read' ? i.read : !i.read))
      .filter(i => !kw || (i.note || '').toLowerCase().includes(kw) || i.url.toLowerCase().includes(kw))
      .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  }, [data.items, folder, plat, status, q, fMap]);

  async function saveItem(url, folderId, name, note, shared) {
    const dup = data.items.find(i => i.url === url);
    if (dup) await store.updateItem(dup.id, { folderId, note: note || dup.note || '' });
    else await store.addItem({ url, platform: platformOf(url).id, note, folderId, read: false, createdAt: Date.now() });
    setSheet(null);
    if (shared) setDone(name); else flash(`已存到「${name}」`);
  }
  function newFolder(name) {
    return store.addFolder({ name, color: COLORS[data.folders.length % COLORS.length], order: Date.now() });
  }
  async function removeFolder(f) {
    if (!confirm(`刪除「${f.name}」？裡面的收藏會移到未分類。`)) return;
    await Promise.all(data.items.filter(i => i.folderId === f.id).map(i => store.updateItem(i.id, { folderId: null })));
    await store.deleteFolder(f.id);
    setSheet(null); setFolder('all'); flash('已刪除資料夾');
  }

  const activeFolder = fMap[folder];

  return html`<div className="app">
    <header><h1>拾綴</h1><span>${data.items.length} 則收藏</span></header>

    <nav className="chips">
      <button className=${'chip' + (folder === 'all' ? ' on' : '')} onClick=${() => setFolder('all')}>全部</button>
      ${folders.map(f => html`<button key=${f.id} className=${'chip' + (folder === f.id ? ' on' : '')} onClick=${() => setFolder(f.id)}>
        <span className="dot" style=${{ background: f.color }}></span>${f.name}
      </button>`)}
      ${counts.none > 0 && html`<button className=${'chip' + (folder === 'none' ? ' on' : '')} onClick=${() => setFolder('none')}>未分類</button>`}
      <button className="chip add" onClick=${async () => {
        const n = prompt('新資料夾名稱'); if (n && n.trim()) { const id = await newFolder(n.trim()); setFolder(id); }
      }}><i className="ph ph-plus"></i>資料夾</button>
    </nav>

    ${activeFolder && html`<div className="folderbar">
      <span>${activeFolder.name}</span>
      <button aria-label="編輯資料夾" onClick=${() => setSheet({ type: 'folder', folder: activeFolder })}><i className="ph ph-pencil-simple"></i></button>
    </div>`}

    <label className="search"><i className="ph ph-magnifying-glass"></i>
      <input placeholder="搜尋備註或網址" value=${q} onChange=${e => setQ(e.target.value)} />
    </label>

    <div className="filters">
      <div className="seg">
        ${[['all', '全部'], ['unread', '待看'], ['read', '已看']].map(([k, t]) =>
          html`<button key=${k} className=${status === k ? 'on' : ''} onClick=${() => setStatus(k)}>${t}</button>`)}
      </div>
      ${usedPlatforms.length > 1 && usedPlatforms.map(p => html`<button key=${p.id} aria-label=${p.name}
        className=${'pbtn' + (plat === p.id ? ' on' : '')} onClick=${() => setPlat(plat === p.id ? '' : p.id)}>
        <i className=${'ph ' + p.icon}></i></button>`)}
    </div>

    ${ready && list.length === 0 && html`<div className="empty">
      <i className="ph ph-bookmark-simple"></i>
      ${data.items.length === 0
        ? html`在 Threads、IG 或 FB 按「分享」，選「拾綴」<br/>或按右下角的 ＋ 貼上網址`
        : '沒有符合條件的收藏'}
    </div>`}

    ${list.map(it => {
      const f = fMap[it.folderId];
      const p = P_BY_ID[it.platform] || WEB;
      return html`<div key=${it.id} className=${'item' + (it.read ? ' read' : '')} style=${{ '--c': f ? f.color : 'var(--line)' }}>
        <button className="check" aria-label=${it.read ? '改回待看' : '標記已看'} onClick=${() => store.updateItem(it.id, { read: !it.read })}>
          <i className=${'ph ' + (it.read ? 'ph-check-circle' : 'ph-circle')}></i>
        </button>
        <a className="body" href=${it.url} target="_blank" rel="noopener">
          ${it.note && html`<div className="note">${it.note}</div>`}
          <div className=${'url' + (it.note ? '' : ' solo')}><i className=${'ph ' + p.icon}></i><span>${shortUrl(it.url)}</span></div>
          <div className="meta"><span>${f ? f.name : '未分類'}</span><span>${relDate(it.createdAt)}</span></div>
        </a>
        <button className="more" aria-label="編輯" onClick=${() => setSheet({ type: 'edit', item: it })}><i className="ph ph-dots-three-vertical"></i></button>
      </div>`;
    })}

    ${store.kind === 'local' && ready && html`<p className="localnote">目前資料只存在這台裝置，接上 Firebase 後就能同步</p>`}

    <button className="fab" aria-label="新增收藏" onClick=${() => setSheet({ type: 'save', url: '', shared: false })}><i className="ph ph-plus"></i></button>

    ${sheet?.type === 'save' && html`<${SaveSheet} init=${sheet.url} shared=${sheet.shared}
      folders=${folders} counts=${counts} items=${data.items}
      onSave=${saveItem} onNewFolder=${newFolder} onClose=${() => setSheet(null)} />`}

    ${sheet?.type === 'edit' && html`<${EditSheet} item=${sheet.item} folders=${folders} onClose=${() => setSheet(null)}
      onSave=${async p => { await store.updateItem(sheet.item.id, p); setSheet(null); flash('已儲存'); }}
      onDelete=${async () => { if (confirm('刪除這則收藏？')) { await store.deleteItem(sheet.item.id); setSheet(null); flash('已刪除'); } }} />`}

    ${sheet?.type === 'folder' && html`<${FolderSheet} folder=${sheet.folder} onClose=${() => setSheet(null)}
      onSave=${async p => { await store.updateFolder(sheet.folder.id, p); setSheet(null); }}
      onDelete=${() => removeFolder(sheet.folder)} />`}

    ${done && html`<div className="done"><div>
      <i className="ph ph-check-circle"></i>
      <h2>已存到「${done}」</h2>
      <p>按返回鍵就能回到原本的 app</p>
      <button className="primary" onClick=${() => setDone(null)}>看所有收藏</button>
    </div></div>`}

    ${toast && html`<div className="toast">${toast}</div>`}
  </div>`;
}

try {
  const store = await createStore();
  createRoot(document.getElementById('root')).render(html`<${App} store=${store} />`);
} catch (e) {
  document.getElementById('root').textContent = '載入失敗：' + e.message;
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
